name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─── Job 1: siempre corre — no necesita backend ───────────────────────────
  validate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Valor de placeholder: solo verifica que compile, no hay runtime
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL || 'http://localhost:3001' }}

  # ─── Job 2: E2E — requiere backend desplegado y secrets configurados ───────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: validate
    # Solo corre en pushes directos a main/dev (no en PRs, donde los secrets no están disponibles)
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install chromium --with-deps

      - name: Ejecutar tests E2E
        run: npm run test:e2e
        env:
          CI: true
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          TEST_E2E_USER: ${{ secrets.TEST_E2E_USER }}
          TEST_E2E_PASS: ${{ secrets.TEST_E2E_PASS }}

      - name: Subir reporte de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
